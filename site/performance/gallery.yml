# GALLERY BURST — the heaviest real traffic (the site has no forms to POST to).
# 50 visitors arrive over 10 seconds and each scrolls the gallery, loading
# 20 random photos (400 px) — 1,000 image requests in total.
# Pass: 95% of responses in under 500 ms, every photo found.
config:
  target: http://localhost:3300 # the runner overrides this with --target
  processor: ./processor.cjs
  phases:
    - name: 50 gallery visitors over 10s
      duration: 10
      arrivalCount: 50
  plugins:
    expect:
      reportFailuresAsErrors: true
    ensure:
      thresholds:
        - http.response_time.p95: 500

scenarios:
  - name: Scroll the gallery
    flow:
      - function: pickGalleryPhotos # sets {{ photos }} to 20 random photo names
      - loop:
          - get:
              url: "/tiles/sm/{{ $loopElement }}.webp"
              expect:
                - statusCode: 200
                - contentType: image/webp
        over: photos

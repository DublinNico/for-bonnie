# PAGE LOAD — the main GET.
# 100 visitors arrive over 10 seconds; each does what a first visit does:
# the page, the mosaic data, the portrait and the mosaic preview.
# Pass: 95% of responses in under 500 ms, every response the right status.
config:
  target: http://localhost:3300 # the runner overrides this with --target
  phases:
    - name: 100 visitors over 10s
      duration: 10
      arrivalCount: 100
  plugins:
    expect:
      reportFailuresAsErrors: true # a wrong status code counts as an error
    ensure:
      thresholds:
        - http.response_time.p95: 500

scenarios:
  - name: First visit
    flow:
      - get:
          url: /
          expect:
            - statusCode: 200
            - contentType: "text/html; charset=utf-8" # Artillery compares this exactly
      - get:
          url: /mosaic.json
          expect:
            - statusCode: 200
            - contentType: json
      - get:
          url: /portrait.webp
          expect:
            - statusCode: 200
      - get:
          url: /mosaic-preview.webp
          expect:
            - statusCode: 200

# Continuous integration: checks the website on every pull request and on main.
# A red X on a PR means one of these steps failed — click "Details" to see which.
name: CI

on:
  # Every PR, whatever branch it targets (so stacked PRs are checked too)
  pull_request:
  # Every push to main (i.e. after a merge)
  push:
    branches: [main]

# If you push again while a run is still going, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  website:
    name: Lint, type-check and build the website
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out the code
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      # Next.js generates some global types (e.g. LayoutProps) into .next/.
      # A fresh CI machine has no .next/ yet, so create them before type-checking.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check (TypeScript)
        run: npx tsc --noEmit

      - name: Production build (same as Vercel runs)
        run: npm run build

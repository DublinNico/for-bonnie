# Continuous integration: checks the project on every pull request and on main.
# A red X on a PR means one of these steps failed — click "Details" to see which.
name: CI

on:
  # Every PR, whatever branch it targets (so stacked PRs are checked too)
  pull_request:
  # Every push to main (i.e. after a merge)
  push:
    branches: [main]

# If you push again while a run is still going, cancel the old run
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------- Python
  python:
    name: Python tests (mosaic pipeline)
    runs-on: ubuntu-latest
    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      # The favicon tests need fonts from a site build, so they skip here (with a reason);
      # everything else runs, with branch coverage
      - name: Unit tests (pytest)
        run: python -m pytest --cov=bonnie --cov=make_web_assets --cov=make_favicon --cov=rename_tiles --cov-branch -rs

  # ---------------------------------------------------------------- Website
  website:
    name: Website — lint, types, unit, build, integration, security, end-to-end
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site

    steps:
      - name: Check out the code
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: site/package-lock.json

      - name: Install dependencies (exactly as locked)
        run: npm ci

      - name: Lint (ESLint)
        run: npm run lint

      # Next.js generates some global types (e.g. LayoutProps) into .next/.
      # A fresh CI machine has no .next/ yet, so create them before type-checking.
      - name: Generate Next.js route types
        run: npx next typegen

      - name: Type-check (TypeScript)
        run: npx tsc --noEmit

      - name: Unit tests (Vitest)
        run: npm test

      - name: Production build (same as Vercel runs)
        run: npm run build

      # These two reuse the build above
      - name: Integration tests (Supertest)
        run: npx vitest run -c vitest.integration.config.mts

      - name: Security tests
        run: npx vitest run -c vitest.security.config.mts

      - name: Install Playwright's browser
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (Playwright, desktop + 375px phone)
        run: npm run test:e2e

      - name: Keep the end-to-end report if something failed
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: site/playwright-report/
          retention-days: 7

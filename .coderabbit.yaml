# CodeRabbit (AI code review) settings for this repo.
# Docs: https://docs.coderabbit.ai/getting-started/configure-coderabbit
reviews:
  # Skip files that can't be meaningfully reviewed, so PRs stay under the
  # free plan's 100-file limit (the tile photos alone are 975 files).
  path_filters:
    - "!site/public/tiles/**" # 325 photos x 3 sizes, generated by make_web_assets.py
    - "!**/*.webp"
    - "!**/*.png"
    - "!**/*.jpg"
    - "!**/*.ico"
    - "!site/public/mosaic.json" # generated by bonnie.py
    - "!**/package-lock.json" # generated by npm

  auto_review:
    enabled: true
    # Also review PRs that target other branches (e.g. stacked PRs), not just main
    base_branches:
      - ".*"
